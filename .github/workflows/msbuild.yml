name: MSBuild

on:
  push:
    branches: [ "master" ]
    # a version tag like 1.0.0 publishes a release; EasyKey's updater downloads
    # releases/download/<versionName>/EasyKey.exe and checks it against EasyKey.exe.sha256
    tags: [ "[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ "master" ]
  # or run "MSBuild" by hand on master (Actions tab, Run workflow): it tags the
  # versionName from version.json and publishes that release
  workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .\Sources\EasyKey\win32\EasyKey

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  engine-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Configure engine tests
      run: cmake -S Sources/EasyKey/tests -B build/tests

    - name: Build engine tests
      run: cmake --build build/tests --config Release

    - name: Run engine tests
      run: ctest --test-dir build/tests -C Release --output-on-failure

  #the same suite under ASan/UBSan (refactor plan step 3.4): an out-of-bounds
  #read in the binary data parsers does not crash a normal build, so only a
  #sanitizer run turns the malformed-data tests into real evidence
  engine-tests-sanitize:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Configure engine tests with sanitizers
      run: cmake -S Sources/EasyKey/tests -B build/tests-sanitize -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

    - name: Build engine tests
      run: cmake --build build/tests-sanitize --config Release

    - name: Run engine tests under sanitizers
      run: ctest --test-dir build/tests-sanitize -C Release --output-on-failure

  build:
    runs-on: windows-latest
    needs: [engine-tests, engine-tests-sanitize]

    steps:
    - uses: actions/checkout@v7

    - name: Guard against committed private key material
      shell: pwsh
      run: |
        $bad = git ls-files | Where-Object { $_ -match '\.(pfx|p12|pvk|key)$' -or $_ -match '^\.signing/' }
        if ($bad) {
          throw "Security violation: private key material tracked in git: $bad"
        }
        Write-Host "Key material check: PASS"

    - name: Verify version.json matches EasyKey.rc
      shell: pwsh
      run: |
        $ver = (Get-Content version.json | ConvertFrom-Json).latestWinVersion.versionName
        $commaVer = ($ver -replace '\.', ',') + ',0'
        $dotVer = "$ver.0"
        $rc = Get-Content Sources/EasyKey/win32/EasyKey/EasyKey/EasyKey.rc -Raw
        if ($rc -notmatch "FILEVERSION\s+$([regex]::Escape($commaVer))" -or $rc -notmatch "PRODUCTVERSION\s+$([regex]::Escape($commaVer))" -or $rc -notmatch "`"FileVersion`",\s*`"$([regex]::Escape($dotVer))`"" -or $rc -notmatch "`"ProductVersion`",\s*`"$([regex]::Escape($dotVer))`"") {
          throw "EasyKey.rc version does not match version.json ($ver)"
        }
        Write-Host "Version consistency check ($ver): PASS"

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build x64
      run: msbuild -m -target:Rebuild -p:Configuration=Release -p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

    - name: Report the exe size
      shell: pwsh
      run: |
        $size = (Get-Item "${{env.SOLUTION_FILE_PATH}}\x64\Release\EasyKey.exe").Length
        Write-Output "EasyKey.exe: $size bytes"
        "EasyKey.exe: $([math]::Round($size / 1KB)) KB ($size bytes)" >> $env:GITHUB_STEP_SUMMARY

    - name: Upload a Build Artifact
      id: upload
      uses: actions/upload-artifact@v7
      with:
        name: EasyKey
        path: ${{env.SOLUTION_FILE_PATH}}/x64/Release/EasyKey.exe
        if-no-files-found: error

    outputs:
      subject-name: EasyKey
      subject-digest: ${{steps.upload.outputs.artifact-digest}}

  attest:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: ${{needs.build.outputs.subject-name}}
        subject-digest: sha256:${{needs.build.outputs.subject-digest}}

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
    - uses: actions/checkout@v7

    - name: Check the version
      id: version
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $version = (Get-Content version.json | ConvertFrom-Json).latestWinVersion.versionName
        if ("${{ github.ref_type }}" -eq "tag" -and $version -ne "${{ github.ref_name }}") {
          throw "Tag ${{ github.ref_name }} does not match version.json versionName $version"
        }
        gh release view $version *> $null
        if ($LASTEXITCODE -eq 0) {
          throw "Release $version already exists, raise versionName in version.json first"
        }
        $global:LASTEXITCODE = 0
        "name=$version" >> $env:GITHUB_OUTPUT

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build x64
      run: msbuild -m -target:Rebuild -p:Configuration=Release -p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

    - name: Sign executable
      shell: pwsh
      env:
        EASYKEY_SIGN_PFX_BASE64: ${{ secrets.EASYKEY_SIGN_PFX_BASE64 }}
        EASYKEY_SIGN_PFX_PASSWORD: ${{ secrets.EASYKEY_SIGN_PFX_PASSWORD }}
        EASYKEY_EXPECTED_THUMBPRINT: ${{ vars.EASYKEY_EXPECTED_THUMBPRINT }}
        EASYKEY_TIMESTAMP_URL: ${{ vars.EASYKEY_TIMESTAMP_URL }}
        EASYKEY_TIMESTAMP_URL_FALLBACK: ${{ vars.EASYKEY_TIMESTAMP_URL_FALLBACK }}
      run: |
        $exe = "${{env.SOLUTION_FILE_PATH}}\x64\Release\EasyKey.exe"
        if ($env:EASYKEY_SIGN_PFX_BASE64 -and $env:EASYKEY_SIGN_PFX_PASSWORD) {
          $pfxTemp = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfxTemp, [Convert]::FromBase64String($env:EASYKEY_SIGN_PFX_BASE64))
          try {
            $signArgs = @{
              Path = $exe
              PfxPath = $pfxTemp
            }
            if ($env:EASYKEY_EXPECTED_THUMBPRINT) {
              $signArgs['ExpectedThumbprint'] = $env:EASYKEY_EXPECTED_THUMBPRINT
            }
            $urls = @($env:EASYKEY_TIMESTAMP_URL, $env:EASYKEY_TIMESTAMP_URL_FALLBACK) | Where-Object { $_ }
            if ($urls.Count -gt 0) {
              $signArgs['TimestampUrl'] = $urls
            }
            & tools\signing\sign.ps1 @signArgs
            & tools\signing\verify.ps1 -Path $exe -JsonPath signature.json
          } finally {
            Remove-Item $pfxTemp -Force -ErrorAction SilentlyContinue
          }
        } elseif ("${{ github.event_name }}" -eq 'pull_request') {
          Write-Warning "EASYKEY_SIGN_PFX_BASE64 not configured; this PR build stays unsigned."
        } else {
          # EasyKey 1.0.23+ refuses an update whose signature is not the pinned EasyKey certificate
          throw "Signing credentials are required: the updater rejects unsigned releases."
        }

    # the signed exe must pass the exact check the updater runs, on a runner that never trusted
    # the EasyKey certificate; otherwise every user would be stuck on the previous version
    - name: Verify signature as the updater does
      if: hashFiles('signature.json') != ''
      shell: pwsh
      run: |
        cmake -S Sources/EasyKey/tests -B build/signature-check
        cmake --build build/signature-check --config Release --target UpdateSignatureTests
        $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
        & build\signature-check\Release\UpdateSignatureTests.exe $signtool.FullName "${{env.SOLUTION_FILE_PATH}}\x64\Release\EasyKey.exe"
        if ($LASTEXITCODE -ne 0) { throw "The signed EasyKey.exe does not pass the updater's signature check." }

    - name: Package
      shell: pwsh
      run: |
        $out = "${{env.SOLUTION_FILE_PATH}}\x64\Release"
        Copy-Item "$out\EasyKey.exe" EasyKey.exe
        $zipName = "EasyKey${{ steps.version.outputs.name }}-Windows.zip"
        Compress-Archive -Path EasyKey.exe -DestinationPath $zipName
        # the in-app updater reads "<sha256>  EasyKey.exe"
        $hashExe = (Get-FileHash EasyKey.exe -Algorithm SHA256).Hash.ToLower()
        [IO.File]::WriteAllText("EasyKey.exe.sha256", "$hashExe  EasyKey.exe`n")
        $hashZip = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
        [IO.File]::WriteAllText("$zipName.sha256", "$hashZip  $zipName`n")
        $sums = "$hashExe  EasyKey.exe`n$hashZip  $zipName`n"
        [IO.File]::WriteAllText("SHA256SUMS.txt", $sums)
    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: |
          EasyKey${{ steps.version.outputs.name }}-Windows.zip
          EasyKey.exe

    - name: Write the release notes
      shell: pwsh
      # only this version's section of each changelog, Vietnamese first
      run: |
        $version = "${{ steps.version.outputs.name }}"
        function Get-Section($file) {
          $section = @()
          $found = $false
          foreach ($line in Get-Content $file -Encoding utf8) {
            if ($line.StartsWith("## ")) {
              if ($found) { break }
              $found = $line -eq "## $version" -or $line.StartsWith("## $version ")
            } elseif ($found) {
              $section += $line
            }
          }
          if (-not $found) { throw "$file has no section for $version" }
          ($section -join "`n").Trim()
        }
        $repo = "https://github.com/${{ github.repository }}/blob/master"
        $notes = (Get-Section CHANGELOG.md) + "`n`n**English**`n`n" + (Get-Section CHANGELOG.en.md) +
          "`n`n[Nhật ký thay đổi]($repo/CHANGELOG.md) · [Changelog]($repo/CHANGELOG.en.md)`n"
        [IO.File]::WriteAllText("release-notes.md", $notes)

    - name: Publish the release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      # on a tag push the tag exists; when run by hand, gh creates it on this commit
      run: |
        $assets = @(
          "EasyKey${{ steps.version.outputs.name }}-Windows.zip",
          "EasyKey${{ steps.version.outputs.name }}-Windows.zip.sha256",
          "EasyKey.exe",
          "EasyKey.exe.sha256",
          "SHA256SUMS.txt",
          "docs/signing/EasyKey-codesign.cer"
        )
        if (Test-Path "signature.json") {
          $assets += "signature.json"
        }
        gh release create "${{ steps.version.outputs.name }}" @assets --title "EasyKey ${{ steps.version.outputs.name }}" --notes-file release-notes.md --target "${{ github.sha }}"
