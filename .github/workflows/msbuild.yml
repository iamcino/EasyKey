name: MSBuild

on:
  push:
    branches: [ "master" ]
    # a version tag like 1.0.0 publishes a release; EasyKey's updater downloads
    # releases/download/<versionName>/EasyKey.exe and checks it against EasyKey.exe.sha256
    tags: [ "[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ "master" ]
  # or run "MSBuild" by hand on master (Actions tab, Run workflow): it tags the
  # versionName from version.json and publishes that release
  workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .\Sources\EasyKey\win32\EasyKey

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  engine-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Configure engine tests
      run: cmake -S Sources/EasyKey/tests -B build/tests

    - name: Build engine tests
      run: cmake --build build/tests --config Release

    - name: Run engine tests
      run: ctest --test-dir build/tests -C Release --output-on-failure

  build:
    runs-on: windows-latest
    needs: engine-tests

    steps:
    - uses: actions/checkout@v7

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build x64
      run: msbuild -m -target:Rebuild -p:Configuration=Release -p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

    - name: Report the exe size
      shell: pwsh
      run: |
        $size = (Get-Item "${{env.SOLUTION_FILE_PATH}}\x64\Release\EasyKey.exe").Length
        Write-Output "EasyKey.exe: $size bytes"
        "EasyKey.exe: $([math]::Round($size / 1KB)) KB ($size bytes)" >> $env:GITHUB_STEP_SUMMARY

    - name: Upload a Build Artifact
      id: upload
      uses: actions/upload-artifact@v7
      with:
        name: EasyKey
        path: ${{env.SOLUTION_FILE_PATH}}/x64/Release/EasyKey.exe
        if-no-files-found: error

    outputs:
      subject-name: EasyKey
      subject-digest: ${{steps.upload.outputs.artifact-digest}}

  attest:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: ${{needs.build.outputs.subject-name}}
        subject-digest: sha256:${{needs.build.outputs.subject-digest}}

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
    - uses: actions/checkout@v7

    - name: Check the version
      id: version
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $version = (Get-Content version.json | ConvertFrom-Json).latestWinVersion.versionName
        if ("${{ github.ref_type }}" -eq "tag" -and $version -ne "${{ github.ref_name }}") {
          throw "Tag ${{ github.ref_name }} does not match version.json versionName $version"
        }
        gh release view $version *> $null
        if ($LASTEXITCODE -eq 0) {
          throw "Release $version already exists, raise versionName in version.json first"
        }
        $global:LASTEXITCODE = 0
        "name=$version" >> $env:GITHUB_OUTPUT

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build x64
      run: msbuild -m -target:Rebuild -p:Configuration=Release -p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

    - name: Package
      shell: pwsh
      run: |
        $out = "${{env.SOLUTION_FILE_PATH}}\x64\Release"
        Copy-Item "$out\EasyKey.exe" EasyKey.exe
        Compress-Archive -Path EasyKey.exe -DestinationPath "EasyKey${{ steps.version.outputs.name }}-Windows.zip"
        # the in-app updater reads "<sha256>  EasyKey.exe"
        $hash = (Get-FileHash EasyKey.exe -Algorithm SHA256).Hash.ToLower()
        [IO.File]::WriteAllText("EasyKey.exe.sha256", "$hash  EasyKey.exe`n")

    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: |
          EasyKey${{ steps.version.outputs.name }}-Windows.zip
          EasyKey.exe

    - name: Write the release notes
      shell: pwsh
      # only this version's section of each changelog, Vietnamese first
      run: |
        $version = "${{ steps.version.outputs.name }}"
        function Get-Section($file) {
          $section = @()
          $found = $false
          foreach ($line in Get-Content $file -Encoding utf8) {
            if ($line.StartsWith("## ")) {
              if ($found) { break }
              $found = $line -eq "## $version" -or $line.StartsWith("## $version ")
            } elseif ($found) {
              $section += $line
            }
          }
          if (-not $found) { throw "$file has no section for $version" }
          ($section -join "`n").Trim()
        }
        $repo = "https://github.com/${{ github.repository }}/blob/master"
        $notes = (Get-Section CHANGELOG.md) + "`n`n**English**`n`n" + (Get-Section CHANGELOG.en.md) +
          "`n`n[Nhật ký thay đổi]($repo/CHANGELOG.md) · [Changelog]($repo/CHANGELOG.en.md)`n"
        [IO.File]::WriteAllText("release-notes.md", $notes)

    - name: Publish the release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      # on a tag push the tag exists; when run by hand, gh creates it on this commit
      run: gh release create "${{ steps.version.outputs.name }}" "EasyKey${{ steps.version.outputs.name }}-Windows.zip" EasyKey.exe EasyKey.exe.sha256 --title "EasyKey ${{ steps.version.outputs.name }}" --notes-file release-notes.md --target "${{ github.sha }}"
