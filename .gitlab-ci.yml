# EasyKey on GitLab: engine tests and a Release|x64 build on every push and merge request,
# and the release job (build, sign, check the signature the way the updater does, package,
# publish) on master, run by hand, or on a version tag such as 1.0.24.
#
# Runs on a self-hosted Windows runner tagged "easykey-windows" (shell executor, PowerShell)
# with Visual Studio 2022 or its Build Tools, the Windows SDK and CMake.
#
# Protected CI/CD variables used by the release job (Settings > CI/CD > Variables):
#   EASYKEY_SIGN_PFX_BASE64    the signing PFX, base64 (masked, protected)
#   EASYKEY_SIGN_PFX_PASSWORD  its password (masked, protected)
#   GITLAB_TOKEN               optional; only if the job token may not create releases

stages: [test, build, release]

default:
  tags: [easykey-windows]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/

variables:
  GIT_DEPTH: "0"
  SOLUTION: Sources\EasyKey\win32\EasyKey\EasyKey.sln

.vs: &vs |
  $ErrorActionPreference = 'Stop'
  $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
  $vsRoot = & $vswhere -latest -products * -property installationPath
  $env:Path = "$vsRoot\MSBuild\Current\Bin;$vsRoot\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin;$env:Path"

engine-tests:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG == null
  script:
    - *vs
    - cmake -S Sources/EasyKey/tests -B build/tests
    - if ($LASTEXITCODE -ne 0) { exit 1 }
    - cmake --build build/tests --config Release
    - if ($LASTEXITCODE -ne 0) { exit 1 }
    - ctest --test-dir build/tests -C Release --output-on-failure
    - if ($LASTEXITCODE -ne 0) { exit 1 }

build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG == null
  script:
    - *vs
    - msbuild /m /nologo /v:minimal /t:Rebuild /p:Configuration=Release /p:Platform=x64 $env:SOLUTION
    - if ($LASTEXITCODE -ne 0) { exit 1 }
  artifacts:
    name: EasyKey-$CI_COMMIT_SHORT_SHA
    paths: [Sources/EasyKey/win32/EasyKey/x64/Release/EasyKey.exe]
    expire_in: 2 weeks

release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
      when: manual
  # the signing key never touches the disk outside this job's temp folder
  script:
    - *vs
    - |
      if (-not $env:EASYKEY_SIGN_PFX_BASE64 -or -not $env:EASYKEY_SIGN_PFX_PASSWORD) {
        throw 'EASYKEY_SIGN_PFX_BASE64 / EASYKEY_SIGN_PFX_PASSWORD are not available. Make them protected variables and run on master or a protected tag.'
      }
      $pfx = Join-Path $env:TEMP "easykey-$env:CI_JOB_ID.pfx"
      [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:EASYKEY_SIGN_PFX_BASE64))
      try {
        & .\tools\release-gitlab.ps1 -Repo $env:CI_PROJECT_DIR -Ref $env:CI_COMMIT_SHA -PfxPath $pfx
      } finally {
        Remove-Item $pfx -Force -ErrorAction SilentlyContinue
      }
